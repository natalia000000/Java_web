
<!DOCTYPE html>

<html lang="es">

<head>

 <meta charset="UTF-8" />

 <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <title>Formulario - Tienda de Deportes</title>

 <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 min-h-screen text-white p-8" style="background: radial-gradient(circle, rgb(87, 215, 224) 0%, rgb(204, 86, 255) 100%)">



 <!-- NAV -->

 <nav class="bg-indigo-600 text-white shadow-md p-4 flex justify-between items-center">

  <span class="text-xl font-bold tracking-wide">Tienda de Deportes</span>

  <div class="space-x-6 font-medium">

   <a href="index.html" class="hover:text-gray-300">Inicio</a>

   <a href="detalles.html" class="hover:text-gray-300">Productos</a>

   <a href="formulario.html" class="hover:text-gray-300">Formulario</a>

  </div>

 </nav>



 <!-- FORMULARIO -->

 <main class="max-w-xl mx-auto mt-10 bg-white text-black p-6 rounded-lg shadow-lg">

  <h2 class="text-2xl font-bold mb-4 text-center text-indigo-600">Registrarse</h2>

  

  <form action="https://formsubmit.co/fra.riveraf@duocuc.cl" method="POST" class="space-y-4">

   <!-- Cambia 'tucorreo@ejemplo.com' por tu correo real -->



   <!-- Configuraciones ocultas -->

   <input type="hidden" name="_subject" value="Nuevo registro en Tienda de Deportes">

   <input type="hidden" name="_next" value="https://tuweb.com/gracias.html">

   <input type="hidden" name="_captcha" value="false">



   <!-- Campos del formulario -->

   <div>

    <label for="nombre" class="block font-medium">Nombre completo:</label>

    <input type="text" id="nombre" name="nombre" required class="w-full p-2 border rounded" />

   </div>



   <div>

    <label for="email" class="block font-medium">Correo electrónico:</label>

    <input type="email" id="email" name="email" required class="w-full p-2 border rounded" />

   </div>



   <div>

    <label for="mensaje" class="block font-medium">Mensaje:</label>

    <textarea id="mensaje" name="mensaje" rows="4" required class="w-full p-2 border rounded"></textarea>

   </div>



   <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700">

    Enviar

   </button>

  </form>

 </main>



</body>

</html>
